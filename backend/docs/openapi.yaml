# COMPONENTS
# ============================================================
components:
  # ── Security Schemes ────────────────────────────────────
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: JWT access token disimpan dalam HTTP-only cookie

  # ── Parameters ──────────────────────────────────────────
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
    SearchQuery:
      name: search
      in: query
      required: false
      schema:
        type: string
      description: Kata kunci pencarian
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 10
      description: Jumlah data per halaman
    OffsetQuery:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
      description: Offset data untuk paginasi

  # ── Reusable Responses ──────────────────────────────────
  responses:
    SuccessNoData:
      description: Operasi berhasil
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessNoDataResponse'
    BadRequest:
      description: Request tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            data: true
            error:
              code: BAD_REQUEST
              message: Bad request
    Unauthorized:
      description: Tidak terautentikasi atau token tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            data: true
            error:
              code: INVALID_TOKEN
              message: "unauthorized : invalid token"
    Forbidden:
      description: Tidak memiliki akses (role tidak sesuai)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            data: true
            error:
              code: FORBIDDEN
              message: "forbidden : insufficient role"
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            data: true
            error:
              code: NOT_FOUND
              message: "not found"
    Conflict:
      description: Data sudah ada (duplikat)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            data: true
            error:
              code: CONFLICT
              message: "data already exists"
    RateLimited:
      description: Terlalu banyak request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            data: true
            error:
              code: RATE_LIMITED
              message: "too many requests"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            data: true
            error:
              code: INTERNAL_SERVER_ERROR
              message: internal server error

  # ── Schemas ─────────────────────────────────────────────
  schemas:
    # ─── Base Envelope ───────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        data:
          nullable: true
        error:
          $ref: '#/components/schemas/APIError'

    APIError:
      type: object
      properties:
        code:
          type: string
          example: BAD_REQUEST
        message:
          type: string
          example: Bad request

    SuccessNoDataResponse:
      type: object
      properties:
        data:
          type: boolean
          example: true
        message:
          type: string
          example: success

    # ─── Auth ────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 13
          pattern: '^[a-zA-Z0-9._]{3,13}$'
          example: admin01
        password:
          type: string
          example: password123

    LoginResponse:
      type: object
      properties:
        username:
          type: string
          example: admin01

    AuthMeResponse:
      type: object
      properties:
        id_pengguna:
          type: integer
          example: 1
        username:
          type: string
          example: admin01
        role:
          $ref: '#/components/schemas/RoleEnum'

    SuccessResponse_LoginResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/LoginResponse'
        message:
          type: string
          example: success

    SuccessResponse_AuthMeResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AuthMeResponse'
        message:
          type: string
          example: success

    # ─── Enums ───────────────────────────────────────────
    RoleEnum:
      type: string
      enum: [ADMIN, GURU, SISWA]

    StatusAkunEnum:
      type: string
      enum: [AKTIF, NONAKTIF]

    StatusUjianEnum:
      type: string
      enum: [BELUM_MULAI, MULAI, SELESAI, DIBATALKAN]

    JobStatusEnum:
      type: string
      enum: [pending, processing, completed, failed]

    ActionEnum:
      type: string
      enum: [LOGIN, LOGOUT, CREATE, UPDATE, DELETE]

    # ─── User / Siswa ───────────────────────────────────
    CreateSiswaRequest:
      type: object
      required: [username, email, password, nama_lengkap, jenis_kelamin, nisn, no_absen, angkatan, tempat_lahir, tanggal_lahir, id_tingkat_kelas, id_nama_kelas]
      properties:
        username:
          type: string
          example: siswa01
        email:
          type: string
          format: email
        password:
          type: string
        nama_lengkap:
          type: string
          example: Ahmad Siswa
        jenis_kelamin:
          type: string
          enum: [L, P]
        no_hp:
          type: string
        foto:
          type: string
          format: binary
          description: File foto profil
        id_tingkat_kelas:
          type: integer
        id_nama_kelas:
          type: integer
        nisn:
          type: string
          minLength: 10
          maxLength: 10
          description: NISN 10 digit angka, atau "-"
          example: "1234567890"
        no_absen:
          type: integer
          minimum: 1
        angkatan:
          type: integer
          minimum: 2019
          example: 2024
        tempat_lahir:
          type: string
        tanggal_lahir:
          type: string
          format: date
          example: "2008-05-15"

    CreateSiswaResponse:
      type: object
