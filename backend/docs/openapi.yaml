        email:
          type: string
        nama_lengkap:
          type: string
        status_akun:
          $ref: '#/components/schemas/StatusAkunEnum'
        nisn:
          type: string
        no_absen:
          type: integer
        angkatan:
          type: integer
        tempat_lahir:
          type: string
        tanggal_lahir:
          type: string
        nama_kelas:
          type: string
        tingkat_kelas:
          type: integer
        foto_profil:
          type: string
        jenis_kelamin:
