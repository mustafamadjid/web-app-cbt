openapi: 3.0.3
info:
  title: Web App CBT (Computer Based Test) API
  description: |
    API Documentation untuk aplikasi ujian berbasis komputer (CBT).
    Semua response mengikuti format envelope:
    ```json
    {
      "data": <T>,
      "message": "string",
      "error": { "code": "string", "message": "string" }
    }
    ```
    Autentikasi menggunakan cookie-based JWT token (access_token & refresh_token).
  version: 1.0.0
  contact:
    name: Mustafa Madjid

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Auth
    description: Autentikasi (Login, Logout, Refresh Token, Auth Me)
  - name: Siswa
    description: Manajemen data siswa (Admin only)
  - name: Guru
    description: Manajemen data guru (Admin only)
  - name: Pengguna
    description: Operasi pengguna umum (Delete, Reset Password - Admin only)
  - name: Kelas
    description: Manajemen tingkat kelas dan nama kelas (Admin only)
  - name: Mata Pelajaran
    description: Manajemen mata pelajaran (Admin only)
  - name: Bank Soal
    description: Manajemen bank soal (Admin & Guru)
  - name: Import Soal
    description: Import soal dari file DOCX (Admin & Guru)
  - name: Ujian
    description: Manajemen ujian dan penjadwalan (Admin & Guru)
  - name: Peserta Ujian
    description: Manajemen peserta ujian (Admin & Guru)
  - name: Jawaban Ujian
    description: Data jawaban ujian siswa (Admin & Guru)
  - name: Sesi
    description: Manajemen sesi ujian (Admin only)
  - name: Pengumuman
    description: Manajemen pengumuman (Admin & Guru)
  - name: Profil Sekolah
    description: Manajemen profil sekolah (Admin only)
  - name: Ruang Ujian
    description: Manajemen ruang ujian (Admin only)
  - name: Aktivitas User
    description: Log aktivitas pengguna (Admin only)

# ============================================================
# PATHS
# ============================================================
paths:
  # ── Auth ──────────────────────────────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      summary: Login pengguna
      description: |
        Autentikasi pengguna dengan username dan password.
        Jika berhasil, access_token dan refresh_token di-set sebagai HTTP-only cookie.
        Rate limit khusus auth berlaku pada endpoint ini.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil
          headers:
            Set-Cookie:
              description: Cookie access_token dan refresh_token
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Kredensial tidak valid atau sudah memiliki sesi aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_credentials:
                  summary: Kredensial salah
                  value:
                    data: true
                    error:
                      code: INVALID_CREDENTIALS
                      message: "unauthorized : invalid credentials"
                has_session:
                  summary: Sudah memiliki sesi aktif
                  value:
                    data: true
                    error:
                      code: HAS_SESSION
                      message: "unauthorized : already has session"
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout pengguna
      description: Menghapus sesi dan membersihkan cookie autentikasi.
      security:
        - cookieAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessNoData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: Menggunakan refresh_token cookie untuk mendapatkan access_token baru.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Token berhasil diperbarui
          headers:
            Set-Cookie:
              description: Cookie access_token baru
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessNoDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Mendapatkan informasi pengguna yang sedang login
      description: Mengembalikan id, username, dan role pengguna dari token yang aktif.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Data pengguna aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_AuthMeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Siswa ─────────────────────────────────────────────────
  /admin/siswa:
    get:
      tags: [Siswa]
      summary: Daftar semua siswa
      description: Mengambil daftar semua data siswa beserta informasi profil.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/OffsetQuery'
      responses:
        '200':
          description: Daftar siswa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_ListSiswa'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Siswa]
      summary: Tambah siswa baru
      description: Membuat akun pengguna baru dengan role SISWA beserta profil siswa.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateSiswaRequest'
      responses:
        '201':
          description: Siswa berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_CreateSiswaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/siswa/{id}:
    get:
      tags: [Siswa]
      summary: Detail siswa berdasarkan ID
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Data siswa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_SiswaItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Siswa]
      summary: Update data siswa
      description: Update parsial data siswa. Hanya field yang dikirim yang akan diubah.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateSiswaRequest'
      responses:
        '200':
          $ref: '#/components/responses/SuccessNoData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

