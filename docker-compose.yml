services:
  postgres:
    image: postgres:16-alpine
    container_name: web-app-cbt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: web-app-cbt-migrate
    profiles:
      - migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DBURL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    command:
      - goose
      - -dir
      - /app/internal/db/migrations
      - postgres
      - postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - up

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: web-app-cbt-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: production
      APP_DIR: /app
      UPLOAD_DIR: /app/public/uploads
      BASE_URL: ${BACKEND_PUBLIC_URL}
      POSTGRES_DBURL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS}
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_uploads:/app/public/uploads
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost:8080/auth/me || test $? -eq 8",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.web-app-cbt-backend.rule=Host(`srv.smafi.my.id`)"
      - "traefik.http.routers.web-app-cbt-backend.entrypoints=websecure"
      - "traefik.http.routers.web-app-cbt-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.web-app-cbt-backend.loadbalancer.server.port=8080"
    networks:
      - default
      - traefik-proxy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: web-app-cbt-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.web-app-cbt-frontend.rule=Host(`ujian.smafi.my.id`)"
      - "traefik.http.routers.web-app-cbt-frontend.entrypoints=websecure"
      - "traefik.http.routers.web-app-cbt-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.web-app-cbt-frontend.loadbalancer.server.port=80"
    networks:
      - default
      - traefik-proxy

volumes:
  postgres_data:
  backend_uploads:

networks:
  traefik-proxy:
    external: true
