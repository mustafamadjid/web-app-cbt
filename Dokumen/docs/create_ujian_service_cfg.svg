<svg xmlns="http://www.w3.org/2000/svg" width="900" height="980" viewBox="0 0 900 980">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <style>
      .node { fill: #fff; stroke: #222; stroke-width: 4; }
      .edge { fill: none; stroke: #222; stroke-width: 4; marker-end: url(#arrow); }
      .num { font: 700 24px Arial, sans-serif; fill: #222; text-anchor: middle; dominant-baseline: middle; }
      .label { font: 20px Arial, sans-serif; fill: #222; }
      .small { font: 16px Arial, sans-serif; fill: #333; }
      .title { font: 700 30px Arial, sans-serif; fill: #111; }
      .subtitle { font: 18px Arial, sans-serif; fill: #444; }
      .legend-box { fill: #fff; stroke: #ddd; stroke-width: 2; rx: 8; }
      .terminal { fill: #f8f8f8; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="980" fill="#fff"/>

  <text x="40" y="50" class="title">Control Flow Graph - CreateUjianService</text>
  <text x="40" y="82" class="subtitle">backend/internal/core/service/ujian/ujian_penjadwalan/create/create_service.go</text>

  <!-- Main graph nodes -->
  <circle class="node" cx="190" cy="145" r="42"/>
